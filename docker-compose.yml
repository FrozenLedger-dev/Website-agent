# Local development Mongo.
#
# Runs as a single-node REPLICA SET, not a standalone. This is mandatory:
# multi-document transactions are unavailable on a standalone mongod, and the
# platform's budget enforcement depends on them (claim + decrement + transition
# must commit or roll back together).
#
# mongod listens on 27018 *inside* the container as well as outside, so the
# replica set's advertised member address (localhost:27018) is both
# self-resolvable by the node and reachable from the host.

services:
  mongo:
    image: mongo:8
    container_name: statxai-mongo
    command: ['--replSet', 'rs0', '--port', '27018', '--bind_ip_all']
    ports:
      - '27018:27018'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Idempotently initiates the replica set, then reports healthy only once
      # the node is actually a writable primary.
      #
      # A successful `rs.initiate()` was previously treated as healthy on its
      # own, which it is not: the election has been called but not necessarily
      # won, so a caller waking on that signal can reach a node that still
      # refuses writes. The transaction probe would catch it, but as a flaky
      # failure rather than a wait.
      test: >
        mongosh --port 27018 --quiet --eval "
          try { rs.status() }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27018'}]}) }
          if (!db.hello().isWritablePrimary) { quit(1) }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

volumes:
  mongo-data:
