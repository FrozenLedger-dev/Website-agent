name: CI

# Every push and every pull request, so a green tick means the same three
# checks passed on a clean machine rather than on a developer's.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Before setup-node, because `cache: pnpm` needs the store path that this
      # step configures.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The lowest version `engines` permits, so CI fails on anything that
          # silently depends on something newer than the stated floor.
          node-version: 20.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `pnpm test` also runs three suites that connect to a real Mongo replica
      # set to prove transaction semantics. They are deliberately not mocked and
      # deliberately not run here: this job provisions nothing and holds no
      # credentials, so a green tick means the deterministic checks passed and
      # says nothing about the integration suites.
      - name: Unit tests (no external infrastructure)
        run: pnpm test:unit
